<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronoscope</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="mark">C</span>
          <div>
            <h1>Chronoscope</h1>
            <p>Failure replay console</p>
          </div>
        </div>

        <div class="action-grid">
          <button id="runDemo" class="primary">Demo incident</button>
          <button id="runBnl" class="secondary">BNL probe</button>
        </div>

        <div class="key-row">
          <input id="apiKey" type="password" placeholder="API key" autocomplete="off" />
          <button id="saveApiKey" aria-label="Save API key">Save</button>
        </div>

        <div id="statusLine" class="status-line">Ready</div>

        <div class="metric-grid">
          <div class="metric">
            <span>Failed replays</span>
            <strong id="replayCount">0</strong>
          </div>
          <div class="metric">
            <span>Source</span>
            <strong id="sourceCount">API</strong>
          </div>
        </div>

        <div id="replayList" class="replay-list"></div>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h2 id="title">No replay selected</h2>
            <p id="subtitle">Run the demo to capture a failed microservice trace.</p>
          </div>
          <div class="actions">
            <span id="incidentTime" class="incident-time">No incident time</span>
            <button id="refresh">Refresh</button>
          </div>
        </header>

        <section class="insight-grid">
          <div class="insight primary-insight">
            <span class="label">Likely cause</span>
            <p id="likelyCause">Waiting for replay evidence.</p>
          </div>
          <div class="insight">
            <span class="label">Services</span>
            <p id="services">-</p>
          </div>
          <div class="insight">
            <span class="label">Duration</span>
            <p id="duration">0ms</p>
          </div>
        </section>

        <section class="timeline-wrap">
          <div class="timeline-head">
            <span>Timeline</span>
            <span id="eventCount">0 events</span>
          </div>
          <div id="timeline" class="timeline empty">No captured failure yet.</div>
        </section>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
